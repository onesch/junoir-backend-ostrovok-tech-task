[project]
name = "junoir-backend-ostrovok-tech-task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
]

[tool.black]
line-length = 79
target-version = ["py312"]

exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | wallpapers
  | database
  | __pycache__
)/
'''

[tool.flake8]
max-line-length = 79

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "wallpapers",
    "database",
    "__pycache__",
]

ignore = [
    "E203",
    "W503",
]
